<template>
    <div class={cardClass}>
        <div class="card__head">
            <div>
                <p class="card__claimno">{claim.Name}</p>
                <p class="card__holder">{policyholder} &middot; {policyNumber}</p>
            </div>
            <span class={badgeClass}>{claim.Status__c}</span>
        </div>

        <div class="card__meta">
            <div class="meta">
                <span class="meta__label">Amount</span>
                <span class="meta__value">{amountFormatted}</span>
            </div>
            <div class="meta">
                <span class="meta__label">Priority</span>
                <span class={priorityClass}>{claim.Priority__c}</span>
            </div>
            <div class="meta">
                <span class="meta__label">Age</span>
                <span class="meta__value">{claim.Age_Days__c} d</span>
            </div>
            <div class="meta">
                <span class="meta__label">Adjuster</span>
                <span class="meta__value">{adjuster}</span>
            </div>
        </div>

        <template lwc:if={hasActions}>
            <div class="card__actions">
                <template for:each={nextActions} for:item="action">
                    <lightning-button
                        key={action.label}
                        label={action.label}
                        variant={action.variant}
                        onclick={handleAdvance}
                        class="card__action-btn">
                    </lightning-button>
                </template>
            </div>
        </template>
    </div>
</template>
